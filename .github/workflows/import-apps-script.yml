name: Import Apps Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          cat > .clasp.json <<EOF
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "./src"
          }
          EOF

      - name: Pull Apps Script source
        run: clasp pull --force

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No Apps Script changes to commit."
          else
            git commit -m "Import Apps Script source"
            git push
          fi
